<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axum Culture and Tourism Office</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Leaflet AwesomeMarkers -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.awesome-markers/2.0.4/leaflet.awesome-markers.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.awesome-markers/2.0.4/leaflet.awesome-markers.js"></script>

</head>
<body>
    <section class="sub-header">
        <h1>Tourist Attraction Map</h1>
</section>

<!-- Map Container -->
<section class="map-section">
    <div id="map"></div>
</section>

<!-- Custom Legend Container -->
<div id="map-legend" class="custom-legend collapsible">
    <div class="legend-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <h4>Map Legend</h4>
    </div>
    <div class="legend-content">
        <!-- Wereda -->
        <div class="legend-section">
            <label><input type="checkbox" checked onchange="toggleLayer('wereda')"> Wereda Boundaries</label>
            <span class="legend-box" style="background:#a6d854;"></span> Example Wereda
        </div>

        <!-- Roads -->
        <div class="legend-section">
            <label><input type="checkbox" checked onchange="toggleLayer('road')"> Roads</label>
            <div id="roadLegendItems"></div>
        </div>

        <!-- Tourist Sites -->
        <div class="legend-section">
            <label><input type="checkbox" checked onchange="toggleLayer('site')"> Tourist Sites</label>
            <div id="siteLegendItems"></div>
        </div>

        <!-- Rivers -->
        <div class="legend-section">
            <label><input type="checkbox" checked onchange="toggleLayer('river')"> Rivers & Waterways</label>
            <span class="legend-line" style="background:#0077be; height: 3px;"></span> River
        </div>

        <!-- Optional: Search -->
        <div style="margin-top: 10px">
            <input type="text" id="siteSearch" placeholder="Search Tourist Site..." onkeyup="searchTouristSite(this.value)" autocomplete="off">
            <div id="suggestions" class="suggestions-list"></div>
        </div>

        <button onclick="resetMapLayers()">Reset All</button>
    </div>
</div>

<!-- Leaflet Scripts -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/map.js"></script>

</body>
</html>
